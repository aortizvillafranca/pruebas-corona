    <style>

        }
        .no-scrollbar::-webkit-scrollbar {

</head>
<body class="bg-stone-50 text-stone-800 font-sans selection:bg-blue-200">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // MODIFICADO: Añadidos imports para Google Auth y signOut
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURACIÓN FIREBASE (Dinámica para el entorno Canvas) ---
        const firebaseConfig = {
  apiKey: "AIzaSyAW0r-_9IGddjXHQyLaRdseT_rTv9tSozg",
  authDomain: "tarumba-shop.firebaseapp.com",
  projectId: "tarumba-shop",
  storageBucket: "tarumba-shop.firebasestorage.app",
  messagingSenderId: "380892951034",
  appId: "1:380892951034:web:f690f661fdc6d74549b443"
};
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'la-corona-app';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const { useState, useEffect, useMemo } = React;

        // --- ICONOS ---
        const IconBase = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Calendar: (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>,
            Users: (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>,

            Utensils: (p) => <IconBase {...p}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></IconBase>,
            Check: (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>,
            X: (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>,
            Plus: (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>,
            ChevronRight: (p) => <IconBase {...p}><polyline points="9 18 15 12 9 6"/></IconBase>,
            ChevronLeft: (p) => <IconBase {...p}><polyline points="15 18 9 12 15 6"/></IconBase>,
            Settings: (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></IconBase>,
            Lock: (p) => <IconBase {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>,
            LogOut: (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>,
            CreditCard: (p) => <IconBase {...p}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></IconBase>,
            Camera: (p) => <IconBase {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></IconBase>,
            User: (p) => <IconBase {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>,
            Award: (p) => <IconBase {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconBase>,
            BookOpen: (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>,
            UserCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.168 18.849a4 4 0 0 1 3.832-2.849h4a4 4 0 0 1 3.834 2.855"/></IconBase>,
            UserPlus: (p) => <IconBase {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></IconBase>,
            Pencil: (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>,
            Trash2: (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>,
            ChefHat: (p) => <IconBase {...p}><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></IconBase>,
            Accessibility: (p) => <IconBase {...p}><circle cx="12" cy="4" r="1"/><path d="m5 20 4.5-10a9 9 0 0 1 5 0l4.5 10"/><path d="M7 22a16 16 0 0 1 10 0"/></IconBase>,
            AlertTriangle: (p) => <IconBase {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>,
            CheckSquare: (p) => <IconBase {...p}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></IconBase>,
            Square: (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></IconBase>,
            List: (p) => <IconBase {...p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></IconBase>,
            Home: (p) => <IconBase {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>,
            CalendarCheck: (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></IconBase>,
            Google: (p) => <IconBase {...p}><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></IconBase>
        };

        // --- SEED DATA (Solo para la primera carga) ---
        const INITIAL_BROTHERS = [];
        const INITIAL_EVENTS = [];
        const INITIAL_TURNS = [];
        const INITIAL_RESERVATIONS = [];

        // --- COMPONENTES AUXILIARES ---
        const Notification = ({ message, type, onClose }) => (
            <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg z-[80] animate-fade-in ${type === 'success' ? 'bg-green-700 text-white' : 'bg-red-700 text-white'}`}>
                <span className="font-medium">{message}</span>
            </div>
        );

        const NavButton = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center p-2 w-16 transition-colors ${active ? 'text-blue-500 font-bold' : 'text-stone-400 hover:text-stone-600'}`}>
                {icon}
                <span className={`text-[10px] font-medium mt-1 ${active ? 'font-bold' : ''}`}>{label}</span>
            </button>
        );

        // --- APP PRINCIPAL ---
        function App() {
            // Firebase Auth Setup
            const [user, setUser] = useState(null); // Firebase User
            const [currentUser, setCurrentUser] = useState(null); // App "Brother" Profile
            
            // App Data (Fetched from Firebase)
            const [brothers, setBrothers] = useState([]);
            const [events, setEvents] = useState([]);
            const [turns, setTurns] = useState([]);
            const [reservations, setReservations] = useState([]);
            
            // UI State
            const [view, setView] = useState(() => localStorage.getItem('appView') || 'dashboard');
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            const [notification, setNotification] = useState(null);
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [adminPin, setAdminPin] = useState('');
            const [calendarDate, setCalendarDate] = useState(new Date());

            // Modals
            const [showEventModal, setShowEventModal] = useState(false);
            const [editingEventId, setEditingEventId] = useState(null);
            const [eventFormData, setEventFormData] = useState({ title: '', date: '', time: '21:30', type: 'cena', guestPrice: 35 });
            const [showTurnModal, setShowTurnModal] = useState(false);
            const [editingTurnId, setEditingTurnId] = useState(null);
            const [turnFormData, setTurnFormData] = useState({ date: '', concept: '', type: 'figura', brotherIds: [] });
            
            // Member Modal
            const [showMemberModal, setShowMemberModal] = useState(false);
            const [editingMemberId, setEditingMemberId] = useState(null);
            const [memberFormData, setMemberFormData] = useState({ name: '', nickname: '', email: '', role: 'hermano', points: 0, attendanceStreak: 0 });

            // Reservation Modal
            const [showReservationModal, setShowReservationModal] = useState(false);
            const [reservationFormData, setReservationFormData] = useState({ date: '', reason: '' });

            const [guestModal, setGuestModal] = useState({ isOpen: false, eventId: null });
            const [confirmationModal, setConfirmationModal] = useState({ isOpen: false, message: '', onConfirm: () => {} });
            const [attendeeModal, setAttendeeModal] = useState({ isOpen: false, eventId: null });

            // Persist View
            useEffect(() => {
                localStorage.setItem('appView', view);
            }, [view]);

            // 1. Initialize Auth State Listener
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (firebaseUser) => {
                    setUser(firebaseUser);
                    if (!firebaseUser) {
                        setIsLoggedIn(false);
                        setCurrentUser(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. Fetch Data
            useEffect(() => {
                if (!user) return;

                // Paths
                const brothersRef = collection(db, 'artifacts', appId, 'public', 'data', 'brothers');
                const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'events');
                const turnsRef = collection(db, 'artifacts', appId, 'public', 'data', 'turns');
                const reservationsRef = collection(db, 'artifacts', appId, 'public', 'data', 'reservations');

                // Subscriptions
                const unsubBrothers = onSnapshot(brothersRef, (snapshot) => {
                    const fetchedBrothers = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                    setBrothers(fetchedBrothers);
                });

                const unsubEvents = onSnapshot(eventsRef, (snapshot) => {
                    const fetchedEvents = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                    fetchedEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
                    setEvents(fetchedEvents);
                });

                const unsubTurns = onSnapshot(turnsRef, (snapshot) => {
                    const fetchedTurns = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                    fetchedTurns.sort((a, b) => {
                        const dateA = new Date(a.date);
                        const dateB = new Date(b.date);
                        if (!isNaN(dateA) && !isNaN(dateB)) return dateA - dateB;
                        return 0;
                    });
                    setTurns(fetchedTurns);
                });

                const unsubReservations = onSnapshot(reservationsRef, (snapshot) => {
                    const fetchedReservations = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                    fetchedReservations.sort((a, b) => new Date(a.date) - new Date(b.date));
                    setReservations(fetchedReservations);
                });

                return () => {
                    unsubBrothers();
                    unsubEvents();
                    unsubTurns();
                    unsubReservations();
                };
            }, [user]);

            // 3. User Matching Logic (Auth + Brothers Data)
            useEffect(() => {
                if (user) {
                    const adminEmail = "aortizvillafranca@gmail.com";
                    
                    // Caso Especial: Administrador Principal
                    if (user.email === adminEmail) {
                        const existingAdmin = brothers.find(b => b.email === adminEmail);
                        if (existingAdmin) {
                            // Si existe pero no es junta, lo forzamos localmente por seguridad o podríamos actualizar DB
                            setCurrentUser({ ...existingAdmin, role: 'junta' });
                            setIsLoggedIn(true);
                        } else if (brothers.length >= 0) { // Esperar a que brothers cargue (al menos vacío)
                            // Crear perfil de admin si no existe
                            const newAdmin = {
                                name: user.displayName || "Administrador",
                                nickname: "Admin",
                                email: adminEmail,
                                role: 'junta',
                                points: 0,
                                attendanceStreak: 0
                            };
                            // Usamos setDoc con el UID para consistencia si quisiéramos, pero addDoc está bien
                            addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'brothers'), newAdmin)
                                .then(() => showNotification("¡Bienvenido Admin! Perfil creado."));
                        }
                    } else {
                        // Caso Normal: Buscar por email
                        const foundBrother = brothers.find(b => b.email === user.email);
                        if (foundBrother) {
                            setCurrentUser(foundBrother);
                            setIsLoggedIn(true);
                        } else if (brothers.length > 0) {
                            // Usuario autenticado en Google pero no en la base de datos de hermanos
                            showNotification("Tu email no está registrado como hermano.", "error");
                            signOut(auth);
                        }
                    }
                }
            }, [user, brothers]);

            // Actions
            const handleGoogleLogin = async () => {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Error login:", error);
                    showNotification("Error al iniciar sesión con Google", "error");
                }
            };

            const handleLogout = async () => {
                await signOut(auth);
                setIsLoggedIn(false);
                setCurrentUser(null);
                setIsAdminAuth(false);
                setAdminPin('');
                localStorage.removeItem('savedBrotherId');
                setView('dashboard');
                localStorage.removeItem('appView');
            };

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            // --- Member Management Logic ---
            const openCreateMemberModal = () => {
                setEditingMemberId(null);
                setMemberFormData({ name: '', nickname: '', email: '', role: 'hermano', points: 0, attendanceStreak: 0 });
                setShowMemberModal(true);
            };

            const openEditMemberModal = (member) => {
                setEditingMemberId(member.id);
                setMemberFormData({ ...member });
                setShowMemberModal(true);
            };

            const saveMember = async () => {
                if (!memberFormData.name || !memberFormData.nickname) {
                    showNotification("Nombre y Apodo obligatorios", 'error');
                    return;
                }
                try {
                    if (editingMemberId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'brothers', editingMemberId), memberFormData);
                        showNotification("Hermano actualizado");
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'brothers'), memberFormData);
                        showNotification("Hermano añadido");
                    }
                    setShowMemberModal(false);
                } catch (e) {
                    showNotification("Error al guardar", 'error');
                }
            };

            const requestDeleteMember = (id) => {
                setConfirmationModal({
                    isOpen: true,
                    message: "¿Eliminar a este hermano? Se borrará de la lista pero sus datos históricos pueden permanecer.",
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'brothers', id));
                        showNotification("Hermano eliminado");
                        setConfirmationModal({ isOpen: false, message: '', onConfirm: () => {} });
                    }
                });
            };

            // --- Event Logic (Firebase) ---
            const openCreateEventModal = () => {
                setEditingEventId(null);
                setEventFormData({ title: '', date: '', time: '21:30', type: 'cena', guestPrice: 35 });
                setShowEventModal(true);
            };

            const openEditEventModal = (ev) => {
                setEditingEventId(ev.id);
                setEventFormData({ title: ev.title, date: ev.date, time: ev.time, type: ev.type, guestPrice: ev.guestPrice });
                setShowEventModal(true);
            };

            const saveEvent = async () => {
                if (!eventFormData.title || !eventFormData.date) {
                    showNotification("Rellena título y fecha", 'error');
                    return;
                }
                const deadlineDate = new Date(eventFormData.date);
                deadlineDate.setDate(deadlineDate.getDate() - 2);
                
                const eventData = {
                    ...eventFormData,
                    guestPrice: Number(eventFormData.guestPrice),
                    deadline: deadlineDate.toISOString()
                };

                try {
                    if (editingEventId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', editingEventId), eventData);
                        showNotification("Evento actualizado");
                    } else {
                        const newEvent = {
                            ...eventData,
                            attendees: [],
                            guests: {},
                            closed: false
                        };
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'events'), newEvent);
                        showNotification("Evento creado correctamente");
                    }
                    setShowEventModal(false);
                } catch (e) {
                    console.error(e);
                    showNotification("Error al guardar", 'error');
                }
            };

            const requestDeleteEvent = (id) => {
                setConfirmationModal({
                    isOpen: true,
                    message: "¿Seguro que quieres eliminar este evento?",
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', id));
                        showNotification("Evento eliminado");
                        setConfirmationModal({ isOpen: false, message: '', onConfirm: () => {} });
                    }
                });
            };

            // --- Reservation Logic ---
            const openReservationModal = (dateStr = '') => {
                setReservationFormData({ date: dateStr, reason: '' });
                setShowReservationModal(true);
            };

            const saveReservation = async () => {
                if (!reservationFormData.date) {
                    showNotification("La fecha es obligatoria", 'error');
                    return;
                }

                // Check Conflicts
                const eventConflict = events.find(e => e.date === reservationFormData.date);
                if (eventConflict) {
                    showNotification(`Fecha ocupada por evento: ${eventConflict.title}`, 'error');
                    return;
                }

                const reservationConflict = reservations.find(r => r.date === reservationFormData.date);
                if (reservationConflict) {
                    const brother = brothers.find(b => b.id === reservationConflict.brotherId);
                    showNotification(`Ya reservado por ${brother ? brother.nickname : 'un hermano'}`, 'error');
                    return;
                }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reservations'), {
                        date: reservationFormData.date,
                        reason: reservationFormData.reason,
                        brotherId: currentUser.id
                    });
                    showNotification("¡Cuartel Reservado!");
                    setShowReservationModal(false);
                } catch(e) {
                    showNotification("Error al reservar", 'error');
                }
            };

            const requestDeleteReservation = (id, brotherId) => {
                if (currentUser.role !== 'junta' && currentUser.id !== brotherId) {
                    showNotification("No puedes borrar esta reserva", 'error');
                    return;
                }
                setConfirmationModal({
                    isOpen: true,
                    message: "¿Anular reserva?",
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reservations', id));
                        showNotification("Reserva anulada");
                        setConfirmationModal({ isOpen: false, message: '', onConfirm: () => {} });
                    }
                });
            };

            // --- Turn Logic (Firebase) ---
            const openCreateTurnModal = () => {
                setEditingTurnId(null);
                setTurnFormData({ date: '', concept: '', type: 'figura', brotherIds: [] });
                setShowTurnModal(true);
            };

            const openEditTurnModal = (turn) => {
                setEditingTurnId(turn.id);
                setTurnFormData({ date: turn.date, concept: turn.concept, type: turn.type, brotherIds: turn.brotherIds });
                setShowTurnModal(true);
            };

            const toggleTurnBrother = (brotherId) => {
                setTurnFormData(prev => {
                    const exists = prev.brotherIds.includes(brotherId);
                    if (exists) return { ...prev, brotherIds: prev.brotherIds.filter(id => id !== brotherId) };
                    return { ...prev, brotherIds: [...prev.brotherIds, brotherId] };
                });
            };

            const saveTurn = async () => {
                if (!turnFormData.date || !turnFormData.concept) {
                    showNotification("Campos obligatorios", 'error');
                    return;
                }
                if (turnFormData.brotherIds.length === 0) {
                    showNotification("Selecciona al menos un hermano", 'error');
                    return;
                }

                try {
                    if (editingTurnId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'turns', editingTurnId), turnFormData);
                        showNotification("Turno actualizado");
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'turns'), turnFormData);
                        showNotification("Turno asignado");
                    }
                    setShowTurnModal(false);
                } catch (e) {
                    showNotification("Error al guardar turno", 'error');
                }
            };

            const requestDeleteTurn = (id) => {
                setConfirmationModal({
                    isOpen: true,
                    message: "¿Eliminar este turno?",
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'turns', id));
                        showNotification("Turno eliminado");
                        setConfirmationModal({ isOpen: false, message: '', onConfirm: () => {} });
                    }
                });
            };

            // --- Attendance Logic (Firebase) ---
            const toggleAttendance = async (eventId) => {
                if (!currentUser) return;
                const ev = events.find(e => e.id === eventId);
                if (!ev) return;

                const isAttending = ev.attendees.includes(currentUser.id);
                let newAttendees = isAttending 
                    ? ev.attendees.filter(id => id !== currentUser.id)
                    : [...ev.attendees, currentUser.id];
                
                const newGuests = { ...ev.guests };
                if (isAttending) delete newGuests[currentUser.id];

                let pointsValue = 0;
                if (ev.type === 'junta') pointsValue = 3;
                else if (ev.type === 'cena') pointsValue = 1;
                else if (ev.type === 'especial') pointsValue = 5;

                const pointsChange = isAttending ? -pointsValue : pointsValue;

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', eventId), {
                        attendees: newAttendees,
                        guests: newGuests
                    });

                    if (pointsChange !== 0) {
                        const newTotalPoints = (currentUser.points || 0) + pointsChange;
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'brothers', currentUser.id), {
                            points: newTotalPoints
                        });
                        setCurrentUser(prev => ({ ...prev, points: newTotalPoints }));
                    }

                    showNotification(isAttending ? `Te has borrado (${-pointsChange} puntos)` : `¡Confirmado! (+${pointsChange} puntos)`);
                } catch (e) {
                    console.error("Error actualizando asistencia:", e);
                    showNotification("Error de conexión", 'error');
                }
            };

            const handleAddGuest = async () => {
                if (!guestModal.eventId || !currentUser) return;
                const ev = events.find(e => e.id === guestModal.eventId);
                if (!ev) return;

                const currentGuests = ev.guests[currentUser.id] || [];
                const newGuestName = `Invitado ${currentGuests.length + 1}`;
                const newGuestList = [...currentGuests, { name: newGuestName, price: ev.guestPrice }];

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', guestModal.eventId), {
                        [`guests.${currentUser.id}`]: newGuestList
                    });
                    setGuestModal({ isOpen: false, eventId: null });
                    showNotification("Invitado añadido");
                } catch(e) {
                    showNotification("Error al añadir invitado", 'error');
                }
            };

            const updateGuests = async (eventId, guestList) => {
                if (!currentUser) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', eventId), {
                        [`guests.${currentUser.id}`]: guestList
                    });
                } catch(e) {
                    console.error(e);
                }
            };

            const openGuestModalForEvent = (eventId) => {
                setGuestModal({ isOpen: true, eventId });
            };

            // Computed Data
            const nextEvent = useMemo(() => {
                return [...events]
                    .sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime())
                    .find(e => new Date(e.date + 'T23:59:00') >= new Date());
            }, [events]);

            const sortedRanking = useMemo(() => {
                return [...brothers].sort((a, b) => b.points - a.points);
            }, [brothers]);

            const myRank = currentUser ? sortedRanking.findIndex(b => b.id === currentUser.id) + 1 : 0;

            const nextKitchenTurn = useMemo(() => {
                if (!currentUser) return null;
                const todayStr = new Date().toISOString().split('T')[0];
                return turns.find(t => 
                    t.type === 'cocina' && 
                    t.brotherIds.includes(currentUser.id) && 
                    t.date >= todayStr
                );
            }, [turns, currentUser]);

            // --- CALENDAR WIDGET ---
            const renderCalendarWidget = () => {
                const year = calendarDate.getFullYear();
                const month = calendarDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0 Sun, 1 Mon...
                
                // Adjust for Monday start (Spain)
                const startDay = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; 

                const changeMonth = (offset) => {
                    const newDate = new Date(calendarDate);
                    newDate.setMonth(newDate.getMonth() + offset);
                    setCalendarDate(newDate);
                };

                const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

                const renderDays = () => {
                    const days = [];
                    // Empty slots
                    for (let i = 0; i < startDay; i++) {
                        days.push(<div key={`empty-${i}`} className="h-20 bg-stone-50 border border-stone-100 rounded-lg"></div>);
                    }
                    
                    // Days
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        
                        // Check status
                        const event = events.find(e => e.date === dateStr);
                        const reservation = reservations.find(r => r.date === dateStr);
                        const reserver = reservation ? brothers.find(b => b.id === reservation.brotherId) : null;

                        let content = null;
                        let cellClass = "bg-white border-stone-200 hover:border-blue-300 cursor-pointer";
                        let onClick = () => openReservationModal(dateStr);

                        if (event) {
                            cellClass = "bg-blue-50 border-blue-200 cursor-not-allowed";
                            content = (
                                <div className="text-[10px] leading-tight text-blue-800 font-bold mt-1 truncate">
                                    {event.title}
                                </div>
                           );
                           onClick = () => showNotification("Día reservado por la hermandad (Evento Oficial)", "error");
                        } else if (reservation) {
                            const isMine = currentUser.id === reservation.brotherId;
                            cellClass = isMine ? "bg-indigo-50 border-indigo-200 cursor-pointer" : "bg-orange-50 border-orange-200 cursor-pointer";
                            content = (
                                <div className={`text-[10px] leading-tight font-bold mt-1 truncate ${isMine ? 'text-indigo-800' : 'text-orange-800'}`}>
                                    {reserver ? reserver.nickname : 'Reservado'}
                                </div>
                            );
                            onClick = () => {
                                if(isMine || currentUser.role === 'junta') {
                                    requestDeleteReservation(reservation.id, reservation.brotherId);
                                } else {
                                    showNotification(`Reservado por ${reserver?.nickname}`, "error");
                                }
                            };
                        }

                        days.push(
                            <div key={d} onClick={onClick} className={`h-20 border rounded-lg p-1 flex flex-col items-start justify-start transition-all shadow-sm ${cellClass}`}>
                                <span className={`text-xs font-bold ${event ? 'text-blue-900' : 'text-stone-500'}`}>{d}</span>
                                {content}
                            </div>
                        );
                    }
                    return days;
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-4 mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={() => changeMonth(-1)} className="p-1 hover:bg-stone-100 rounded-full"><Icons.ChevronLeft size={20}/></button>
                            <h3 className="font-bold text-lg text-stone-800 capitalize">{monthNames[month]} {year}</h3>
                            <button onClick={() => changeMonth(1)} className="p-1 hover:bg-stone-100 rounded-full"><Icons.ChevronRight size={20}/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 mb-2 text-center">
                           {['L','M','X','J','V','S','D'].map(day => <span key={day} className="text-xs font-bold text-stone-400">{day}</span>)}
                        </div>
                        <div className="grid grid-cols-7 gap-1">
                            {renderDays()}
                        </div>
                        <div className="flex gap-4 mt-3 text-xs justify-center">
                            <div className="flex items-center gap-1"><div className="w-3 h-3 bg-blue-100 border border-blue-300 rounded"></div><span className="text-stone-500">Evento</span></div>
                            <div className="flex items-center gap-1"><div className="w-3 h-3 bg-orange-100 border border-orange-300 rounded"></div><span className="text-stone-500">Reservado</span></div>
                            <div className="flex items-center gap-1"><div className="w-3 h-3 bg-indigo-100 border border-indigo-300 rounded"></div><span className="text-stone-500">Tuyo</span></div>
                        </div>
                    </div>
                );
            };

            // --- RENDER MODALS ---
            const renderReservationModal = () => {
                if (!showReservationModal) return null;
                return (
                    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                        <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                            <h3 className="text-lg font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Home size={20}/> Reservar Cuartel</h3>
                            <div className="space-y-3">
                                <label className="block text-sm font-medium text-stone-600">Fecha</label>
                                <input type="date" className="w-full p-2 border rounded" value={reservationFormData.date} onChange={e => setReservationFormData({...reservationFormData, date: e.target.value})} />
                                <label className="block text-sm font-medium text-stone-600">Motivo (Opcional)</label>
                                <input type="text" placeholder="Ej: Cumpleaños, Comida familiar..." className="w-full p-2 border rounded" value={reservationFormData.reason} onChange={e => setReservationFormData({...reservationFormData, reason: e.target.value})} />
                            </div>
                            <div className="flex gap-2 mt-6">
                                <button onClick={() => setShowReservationModal(false)} className="flex-1 py-2 text-stone-500 font-medium hover:bg-stone-50 rounded-lg">Cancelar</button>
                                <button onClick={saveReservation} className="flex-1 py-2 bg-blue-400 hover:bg-blue-500 text-white rounded-lg font-bold shadow-md">Confirmar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderGuestModal = () => {
                if (!guestModal.isOpen) return null;
                const ev = events.find(e => e.id === guestModal.eventId);
                return (
                    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                        <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-bold text-stone-800 flex items-center gap-2"><Icons.UserPlus className="text-blue-500" size={20}/> Añadir Invitado</h3>
                                <button onClick={() => setGuestModal({ isOpen: false, eventId: null })} className="text-stone-400 hover:text-stone-600"><Icons.X size={20}/></button>
                            </div>
                            <div className="space-y-4">
                                <div className="bg-blue-50 p-6 rounded-lg border border-blue-100 text-center">
                                    <span className="text-xs font-bold text-stone-400 uppercase block mb-1">Precio por invitado</span>
                                    <span className="text-4xl font-bold text-blue-600">{ev?.guestPrice} €</span>
                                </div>
                                <p className="text-center text-sm text-stone-500">¿Quieres añadir un invitado a tu cuenta?</p>
                           </div>
                            <div className="flex gap-3 mt-6">
                                <button onClick={() => setGuestModal({ isOpen: false, eventId: null })} className="flex-1 py-3 text-stone-500 font-medium hover:bg-stone-50 rounded-lg">Cancelar</button>
                                <button onClick={handleAddGuest} className="flex-1 py-3 bg-blue-400 hover:bg-blue-500 text-white rounded-lg font-bold shadow-md">Sí, Añadir</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderConfirmationModal = () => {
                if (!confirmationModal.isOpen) return null;
                return (
                    <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                        <div className="bg-white rounded-xl p-6 w-full max-w-xs shadow-2xl text-center">
                            <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.AlertTriangle size={24}/></div>
                            <h3 className="text-lg font-bold text-stone-800 mb-2">Confirmar Acción</h3>
                            <p className="text-stone-600 text-sm mb-6">{confirmationModal.message}</p>
                            <div className="flex gap-2">
                                <button onClick={() => setConfirmationModal({ isOpen: false, message: '', onConfirm: () => {} })} className="flex-1 py-2 text-stone-500 font-bold hover:bg-stone-50 rounded">Cancelar</button>
                                <button onClick={confirmationModal.onConfirm} className="flex-1 py-2 bg-blue-600 text-white font-bold rounded shadow hover:bg-blue-700">Confirmar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderAttendeeModal = () => {
                if (!attendeeModal.isOpen || !attendeeModal.eventId) return null;
                const ev = events.find(e => e.id === attendeeModal.eventId);
                if (!ev) return null;
                const attendingBrothers = brothers.filter(b => ev.attendees.includes(b.id));
                const guestSummary = Object.entries(ev.guests).map(([broId, guestList]) => {
                    const bro = brothers.find(b => b.id === broId);
                    return { brotherName: bro?.nickname || 'Desconocido', count: guestList.length };
                }).filter(item => item.count > 0);

                return (
                    <div className="fixed inset-0 bg-black/60 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm animate-fade-in">
                        <div className="bg-white rounded-t-2xl sm:rounded-xl w-full max-w-sm h-[80vh] sm:h-auto sm:max-h-[80vh] shadow-2xl flex flex-col overflow-hidden">
                            <div className="p-4 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                               <div><h3 className="font-bold text-stone-800 text-lg">Lista de Asistencia</h3><p className="text-xs text-stone-500">{ev.title}</p></div>
                                <button onClick={() => setAttendeeModal({ isOpen: false, eventId: null })} className="p-2 bg-white rounded-full text-stone-400 hover:text-stone-600 shadow-sm"><Icons.X size={20}/></button>
                            </div>
                            <div className="overflow-y-auto p-4 space-y-6 flex-1">
                                <div>
                                    <h4 className="text-xs font-bold text-stone-400 uppercase mb-3 flex items-center gap-2"><Icons.UserCircle size={14}/> Hermanos ({attendingBrothers.length})</h4>
                                   {attendingBrothers.length > 0 ? (
                                        <div className="grid grid-cols-1 gap-2">
                                           {attendingBrothers.map(b => (
                                                <div key={b.id} className="flex items-center gap-3 p-2 rounded-lg hover:bg-stone-50">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${b.role === 'junta' ? 'bg-yellow-100 text-yellow-700' : 'bg-stone-200 text-stone-600'}`}>{b.nickname.substring(0, 2).toUpperCase()}</div>
                                                    <span className="font-medium text-stone-700">{b.nickname}</span>
                                                </div>
                                           ))}
                                        </div>
                                    ) : <p className="text-sm text-stone-400 italic pl-2">Ningún hermano apuntado aún.</p>}
                                </div>
                                <div>
                                    <h4 className="text-xs font-bold text-stone-400 uppercase mb-3 flex items-center gap-2"><Icons.UserPlus size={14}/> Invitados ({Object.values(ev.guests).reduce((acc, curr) => acc + curr.length, 0)})</h4>
                                   {guestSummary.length > 0 ? (
                                        <div className="space-y-2">
                                           {guestSummary.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center p-3 bg-stone-50 rounded-lg border border-stone-100">
                                                    <span className="text-sm text-stone-600">Invitados de <span className="font-bold text-stone-800">{item.brotherName}</span></span>
                                                    <span className="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-full">{item.count}</span>
                                                </div>
                                           ))}
                                        </div>
                                    ) : <p className="text-sm text-stone-400 italic pl-2">No hay invitados en la lista.</p>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderMemberModal = () => {
                if (!showMemberModal) return null;
                return (
                    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                        <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                            <h3 className="text-lg font-bold text-stone-800 mb-4">{editingMemberId ? 'Editar Hermano' : 'Añadir Hermano'}</h3>
                            <div className="space-y-3">
                                <input type="text" placeholder="Nombre completo" className="w-full p-2 border rounded" value={memberFormData.name} onChange={e => setMemberFormData({...memberFormData, name: e.target.value})}/>
                                <input type="text" placeholder="Apodo (ej: Curro)" className="w-full p-2 border rounded" value={memberFormData.nickname} onChange={e => setMemberFormData({...memberFormData, nickname: e.target.value})}/>
                                <input type="email" placeholder="Email Google (ej: usuario@gmail.com)" className="w-full p-2 border rounded" value={memberFormData.email || ''} onChange={e => setMemberFormData({...memberFormData, email: e.target.value})}/>
                                <div className="grid grid-cols-2 gap-2">
                                    <select className="w-full p-2 border rounded" value={memberFormData.role} onChange={e => setMemberFormData({...memberFormData, role: e.target.value})}><option value="hermano">Hermano</option><option value="junta">Junta</option></select>
                                    <input type="number" placeholder="Puntos" className="w-full p-2 border rounded" value={memberFormData.points} onChange={e => setMemberFormData({...memberFormData, points: Number(e.target.value)})}/>
                                </div>
                            </div>
                            <div className="flex gap-2 mt-6">
                                <button onClick={() => setShowMemberModal(false)} className="flex-1 py-2 text-stone-500">Cancelar</button>
                                <button onClick={saveMember} className="flex-1 py-2 bg-blue-400 text-white rounded font-bold">Guardar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- VISTAS ---
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-blue-400 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: 'radial-gradient(circle, #fbbf24 1px, transparent 1px)', backgroundSize: '30px 30px' }}></div>
                        <div className="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-8 z-10 animate-fade-in flex flex-col items-center">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-serif font-bold text-blue-600 mb-2">La Corona</h1>
                                <p className="text-stone-500 uppercase tracking-widest text-xs font-bold">Los Mitigadores de Jesús</p>
                            </div>
                            
                            <div className="w-full space-y-4">
                                <button onClick={handleGoogleLogin} className="w-full bg-white border border-stone-200 hover:border-blue-300 hover:bg-blue-50 text-stone-700 font-bold py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-3">
                                    <div className="bg-white p-1 rounded-full"><Icons.Google size={20}/></div>
                                    <span>Iniciar sesión con Google</span>
                                </button>
                                <p className="text-xs text-center text-stone-400 max-w-[200px] mx-auto leading-relaxed">
                                    Acceso exclusivo para hermanos registrados. Contacta con la Junta si no puedes entrar.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            const renderDashboardView = () => (
                <div className="space-y-6 pb-20 animate-fade-in">
                    <div className="relative h-48 bg-blue-400 rounded-b-3xl shadow-xl overflow-hidden">
                        {/* Botón de Cerrar Sesión (Visible para todos) */}
                       <button onClick={handleLogout} className="absolute top-4 right-4 bg-black/20 backdrop-blur-md p-2 rounded-full text-white hover:bg-black/30 transition-colors z-20" title="Cerrar Sesión">
                            <Icons.LogOut size={20} />
                        </button>
                        
                        <div className="absolute inset-0 bg-gradient-to-b from-transparent to-blue-900/90 flex flex-col justify-end p-6">
                            <div className="flex justify-between items-end">
                               <div><p className="text-yellow-500/80 text-xs font-bold uppercase tracking-wider mb-1">Bienvenido</p><h1 className="text-3xl font-serif text-white font-bold drop-shadow-md">{currentUser.nickname}</h1></div>
                               {currentUser.role === 'junta' && <span className="bg-yellow-500 text-blue-900 text-[10px] font-bold px-2 py-1 rounded uppercase">Directiva</span>}
                            </div>
                        </div>
                    </div>
                    <div className="px-4 -mt-8 relative z-10">
                        {nextEvent ? (

                                               </div>
                                           ))}
                                       </div>
                                    ) : <div className="p-4 text-center text-sm text-stone-400">No hay hermanos registrados</div>}
                                </div>
                            </section>

                           <section><h3 className="text-sm font-bold text-stone-400 uppercase mb-3">Eventos Activos</h3><div className="space-y-2">{events.length > 0 ? events.map(ev => (<div key={ev.id} className="bg-white p-3 rounded-xl border border-stone-200 flex justify-between items-center"><div><span className="block font-bold text-stone-800 text-sm">{ev.title}</span><span className="text-xs text-stone-500">{new Date(ev.date).toLocaleDateString()} • {ev.guestPrice}€ Inv.</span></div><div className="flex gap-2"><button onClick={() => openEditEventModal(ev)} className="p-2 bg-stone-100 text-stone-600 rounded-lg hover:bg-stone-200"><Icons.Pencil size={16}/></button><button onClick={() => requestDeleteEvent(ev.id)} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100"><Icons.Trash2 size={16}/></button></div></div>)) : <div className="text-center p-4 text-stone-400 text-sm italic">No hay eventos activos</div>}</div></section>
                           <section><h3 className="text-sm font-bold text-stone-400 uppercase mb-3">Gestión de Turnos</h3><div className="space-y-2">{turns.length > 0 ? turns.map(t => (<div key={t.id} className="bg-white p-3 rounded-xl border border-stone-200 flex justify-between items-center"><div><span className="block font-bold text-stone-800 text-sm flex items-center gap-2">{t.type === 'cocina' ? <Icons.ChefHat size={14} className="text-orange-500"/> : <Icons.Accessibility size={14} className="text-purple-500"/>}{t.concept}</span><span className="text-xs text-stone-500">{t.type === 'cocina' ? new Date(t.date).toLocaleDateString() : t.date} • {t.brotherIds.length} {t.brotherIds.length === 1 ? 'Hermano' : 'Hermanos'}</span></div><div className="flex gap-2"><button onClick={() => openEditTurnModal(t)} className="p-2 bg-stone-100 text-stone-600 rounded-lg hover:bg-stone-200"><Icons.Pencil size={16}/></button><button onClick={() => requestDeleteTurn(t.id)} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100"><Icons.Trash2 size={16}/></button></div></div>)) : <div className="text-center p-4 text-stone-400 text-sm italic">No hay turnos asignados</div>}</div></section>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen font-sans text-stone-800 max-w-md mx-auto bg-white shadow-2xl relative">
                    {notification && <Notification message={notification.msg} type={notification.type} onClose={() => setNotification(null)}/>}
                    <main className="min-h-screen pb-20">
                        {view === 'dashboard' && renderDashboardView()}
                       {view === 'calendar' && renderCalendarView()}
                        {view === 'ranking' && renderRankingView()}
                        {view === 'turnos' && renderTurnosView()}
                        {view === 'profile' && renderProfileAdminView()}
                    </main>
                    {renderGuestModal()}
                    {renderReservationModal()}
                    {renderConfirmationModal()}
                    {renderAttendeeModal()}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-stone-200 px-2 pb-6 pt-2 z-40 flex justify-around items-end">
                        <NavButton icon={<Icons.Settings size={20}/>} label="Inicio" active={view === 'dashboard'} onClick={() => setView('dashboard')}/>
                        <NavButton icon={<Icons.Calendar size={20}/>} label="Agenda" active={view === 'calendar'} onClick={() => setView('calendar')}/>
                        <div className="relative -top-5"><button onClick={() => setView('ranking')} className="bg-blue-400 text-white p-4 rounded-full shadow-lg hover:scale-105 transition-transform border-4 border-white"><Icons.Trophy size={24}/></button></div>
                        <NavButton icon={<Icons.User size={20}/>} label="Turnos" active={view === 'turnos'} onClick={() => setView('turnos')}/>
                        {currentUser?.role === 'junta' && (
                            <NavButton icon={<Icons.BookOpen size={20}/>} label="Perfil" active={view === 'profile'} onClick={() => setView('profile')}/>
                        )}
                   </nav>
               </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
